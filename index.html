<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="inputArea">
      <div class="listTitle">输入列表</div>
      <div class="DRAG input">📥 点击或拖入源文件/文件夹至此</div>
      <div class="inputBtn">
        <button class="empty">清空列表</button>
        <button class="remove">移出列表</button>
        <button class="reset">取消选中</button>
      </div>
      <div class="INPUT"></div>
    </div>

    <div class="actor">
      <div class="file-actions">
        <div class="action-title">输入列表 → 目标目录</div>
        <div class="action-group">
          <button class="copyToOutput">复制 →</button>
          <button class="moveToOutput">移动 →</button>
        </div>
      </div>
      <button class="resetAll" style="color: gray">取消所有选中</button>
      <button class="openDir">在资源管理器中打开</button>
      <button class="deleteSelected">彻底删除</button>
      <button class="removeDuplicates">移除重复文件</button>
      <button class="renameSelected">重命名所选文件</button>
      <div class="file-actions">
        <div class="action-title">输入列表 ← 目标目录</div>
        <div class="action-group">
          <button class="copyToInput">← 复制</button>
          <button class="moveToInput">← 移动</button>
        </div>
      </div>
    </div>

    <div class="outputArea">
      <div class="listTitle">输出列表</div>
      <div class="DRAG output">📂 点击或拖入目标目录至此</div>
      <div class="outputBtn">
        <button class="addToInput">提取所选到输入列表</button>
        <button class="empty">清空列表</button>
        <button class="remove">移出列表</button>
        <button class="reset">取消选中</button>
      </div>
      <div class="OUTPUT"></div>
    </div>

    <!-- 重命名对话框 -->
    <div id="renameDialog" class="dialog">
      <div class="dialog-content">
        <h3>重命名文件</h3>
        <div class="rename-options">
          <div class="option">
            <input
              type="radio"
              id="indexRename"
              name="renameMode"
              value="index"
              checked
            />
            <label for="indexRename">添加序号</label>
          </div>
          <div class="option">
            <input
              type="radio"
              id="directRename"
              name="renameMode"
              value="direct"
            />
            <label for="directRename">直接重命名</label>
          </div>
          <div class="option">
            <input
              type="radio"
              id="regexRename"
              name="renameMode"
              value="regex"
            />
            <label for="regexRename">正则替换</label>
          </div>
        </div>
        <div class="rename-inputs">
          <div class="input-group index-only">
            <label>序号排序方式：</label>
            <div class="sort-options">
              <div class="option">
                <input
                  type="radio"
                  id="sortBySelection"
                  name="indexSortMode"
                  value="selection"
                  checked
                />
                <label for="sortBySelection">按勾选顺序</label>
              </div>
              <div class="option">
                <input
                  type="radio"
                  id="sortByFilename"
                  name="indexSortMode"
                  value="filename"
                />
                <label for="sortByFilename">按文件名排序</label>
              </div>
            </div>
          </div>
          <div class="input-group direct-only">
            <label for="newName">新名称：</label>
            <input type="text" id="newName" placeholder="输入新名称" />
          </div>
          <div class="input-group regex-only">
            <label for="regexPattern">正则表达式：</label>
            <input
              type="text"
              id="regexPattern"
              placeholder="替换内容的正则表达式"
            />
          </div>
          <div class="input-group regex-only">
            <label for="regexReplacement">替换为：</label>
            <input
              type="text"
              id="regexReplacement"
              placeholder="请输入替换内容"
            />
          </div>
        </div>
        <div class="preview">
          <div class="preview-header">
            <span>原名称</span>
            <span>→</span>
            <span>新名称</span>
          </div>
          <div id="renamePreview"></div>
        </div>
        <div class="copy-filenames">
          <button id="copyFilenames">复制新名称</button>
        </div>
        <div class="dialog-buttons">
          <button id="cancelRename">取消</button>
          <button id="confirmRename">确认</button>
        </div>
      </div>
    </div>

    <!-- 重复文件对话框 -->
    <div id="duplicateDialog" class="dialog">
      <div class="dialog-content">
        <h3>查找重复文件</h3>
        <div class="duplicate-options">
          <div class="input-group">
            <label for="scanPath">扫描路径：</label>
            <input
              type="text"
              id="scanPath"
              placeholder="输入要扫描的目录路径"
            />
          </div>
          <div class="option">
            <input type="checkbox" id="includeSubdirs" checked />
            <label for="includeSubdirs">包含子目录</label>
          </div>
        </div>
        <div id="duplicateResults"></div>
        <div class="dialog-buttons">
          <button id="selectAllDuplicates" style="display: none">
            全选所有重复文件
          </button>
          <button id="scanDuplicates">开始扫描</button>
          <button id="cancelDuplicate">取消</button>
          <button
            id="deleteDuplicates"
            style="
              background: #ff4d4f;
              color: white;
              border-color: #ff4d4f;
              display: none;
            "
          >
            删除重复文件
          </button>
        </div>
      </div>
    </div>
  </body>
  <script src="./jquery.3.7.1.min.js"></script>
  <script src="./index.js?version=1.0.0"></script>
</html>
